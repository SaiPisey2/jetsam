global:
  scrape_interval: 5s
  evaluation_interval: 15s
  # Query logging is a config-file field in this Prometheus version, not a
  # CLI flag (the --query.log-file flag the brief specified does not exist
  # in v3.13.0 and crashes the server on startup).
  query_log_file: /querylog/queries.log

rule_files:
  - /etc/prometheus/rules/*.yaml

# The job names are not free to choose: every vendored rule selects on
# job=, and the prometheus rules also select namespace="monitoring". The
# rules are the upstream artifact and therefore the authority, so the
# stack is named to match them. Renaming a job here to something tidier
# silently empties all 15 recording rules.
scrape_configs:
  - job_name: prometheus-k8s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          namespace: monitoring

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: loadgen
    static_configs:
      - targets: ['loadgen:8081']
