name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: go vet ./...
      - run: go test ./... -race
      - run: CGO_ENABLED=0 go build ./cmd/jetsam

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit trailers
        run: |
          if git log --format='%H %B' | grep -iE 'co-authored-by:|generated with|🤖|noreply@'; then
            echo "commit history contains an attribution trailer" >&2
            exit 1
          fi
          echo "history clean"

  integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: go test ./internal/e2e/ -tags=integration -v -count=1
